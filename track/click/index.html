<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yophish</title>
    <style>
      :root {
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
        background:
          radial-gradient(circle at top, rgba(127, 29, 29, 0.28), transparent 36%),
          #000000;
        color: #f4f4f5;
        font-family: Arial, sans-serif;
      }

      main {
        width: min(100%, 38rem);
        padding: 2.75rem 2.25rem;
        border: 1px solid #27272a;
        border-radius: 1.25rem;
        background: rgba(6, 6, 6, 0.96);
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.55);
        text-align: center;
      }

      .badge {
        display: inline-block;
        margin-bottom: 1.25rem;
        padding: 0.5rem 0.85rem;
        border: 1px solid rgba(239, 68, 68, 0.45);
        border-radius: 999px;
        color: #fca5a5;
        font-size: 0.8rem;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0 0 1rem;
        color: #ef4444;
        font-size: clamp(2rem, 8vw, 3.4rem);
        line-height: 1;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      p {
        margin: 0;
        color: #d4d4d8;
        font-size: 1.05rem;
        line-height: 1.7;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="badge">Tracked Click</div>
      <h1>Sorry I catch you !</h1>
      <p>You clicked the phishing simulation link.</p>
    </main>

    <script>
      (async function () {
        const params = new URLSearchParams(window.location.search);
        const token = params.get("token");
        const apiBase = (params.get("api") || "").replace(/\/+$/, "");

        if (!token) {
          return;
        }

        if (!apiBase) {
          return;
        }

        try {
          await fetch(`${apiBase}/api/track/click`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({ token }),
          });
        } catch (_error) {}
      })();
    </script>
  </body>
</html>
